<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snuffed for chrome</title>
    <style>
      @font-face {
        font-family: "Neco";
        src: url("../fonts/Neco-Regular.otf") format("opentype");
      }
      @font-face {
        font-family: "Satoshi";
        src: url("../fonts/Satoshi-Regular.otf") format("opentype");
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f2eae4;
        font-family: "Satoshi", system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-family: "Neco", Georgia, serif;
        font-size: 3rem;
        font-weight: 400;
      }
      p,
      li {
        color: #9a918b;
        line-height: 1.6;
      }
      code {
        color: #f2eae4;
      }
      a {
        color: #ffd66b;
      }
      a.cta {
        display: inline-block;
        margin: 1rem 0;
        padding: 0.7rem 1.35rem;
        border-radius: 999px;
        border: 1px solid #ffd66b8c;
        color: #f2eae4;
        text-decoration: none;
      }
      a.cta:hover {
        color: #000;
        background: linear-gradient(135deg, #ffd66b, #f5a524 48%, #ed7014);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>snuffed for chrome</h1>
      <p>pauses checkout using rules you set.</p>
      <a class="cta" href="snuffed-extension.zip" download>download extension</a>
      <ol>
        <li>Unzip <code>snuffed-extension.zip</code>.</li>
        <li>Open <code>chrome://extensions</code> and turn on Developer mode.</li>
        <li>Click <strong>Load unpacked</strong> and pick the unzipped folder.</li>
        <li>Try it on the <a href="../store/">demo store</a>.</li>
      </ol>
    </main>
  </body>
</html>
